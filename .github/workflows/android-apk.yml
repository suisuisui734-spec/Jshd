name: Android APK Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug & Optional Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v7

      - name: 2. Install Eclipse Temurin JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: 3. Check Java version
        run: java -version

      - name: 4. Grant executable permission to gradlew
        run: chmod +x ./gradlew

      - name: 5. Prepare Gradle dependencies
        run: ./gradlew --no-daemon dependencies --configuration debugRuntimeClasspath > /dev/null

      - name: 6-8. Run unit tests, clean build, and assembleDebug APK
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug

      - name: 9. Verify Debug APK exists
        run: |
          ls -lh app/build/outputs/apk/debug/
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Debug APK not found in app/build/outputs/apk/debug/"
            exit 1
          fi
          echo "Verified Debug APK: $APK_FILE"

      - name: 10. Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: anime-arena-legends-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Optional Signed Release APK Build
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_TMP="${{ runner.temp }}/release-upload.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_TMP"
          export KEYSTORE_PATH="$KEYSTORE_TMP"
          ./gradlew --no-daemon assembleRelease
          UNSIGNED_OR_SIGNED=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_OR_SIGNED" ]; then
            echo "ERROR: Release APK not generated"
            exit 1
          fi
          rm -f "$KEYSTORE_TMP"

      - name: Upload Signed Release APK Artifact (when configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: anime-arena-legends-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn
